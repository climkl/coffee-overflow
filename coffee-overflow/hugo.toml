baseURL = "https://climkl.github.io/coffee-overflow/"
timeZone = "Asia/Singapore"
disqusShortname = ""
enableGitInfo = true
enableRobotsTXT = true
hasCJKLanguage = true
locale = "en" #languageCode is dep
rssLimit = 10
theme = "hugo-texify3"
title = "Coffee Overflow" #name on browser tab 

[pagination]
pagerSize = 5

[taxonomies]
tags = "tags"
categories = "categories"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]


[params]
title="Coffee Overflow"
author = "Christine Lim"
description = "Thoughts that brew with enough coffee."
footnote = """
Powered by  <a class=link href=https://gohugo.io target=_blank rel=noopener>Hugo</a> | 
Theme <a class=link href=https://github.com/michaelneuper/hugo-texify3 target=_blank rel=noopener>TeXify3</a>
"""
customCSS = ["css/custom.css"]
customJS = []
dateFormat = "2 January 2006"
emphasisWithDots = true
toc = true
rootFontSize = "105%"
math = true
enableDuckDuckGoSearchBox = false
numberedSubtitles = true

[params.commentEngine]
